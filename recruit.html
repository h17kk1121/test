<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>採用情報 | GRILL HOUSE</title>
<style>
:root{--red:#b22222;--dark:#222;--cream:#fff8ef;--gold:#d8a64e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;color:#28231f;background:#fff}
a{color:inherit}
.top-menu{position:sticky;top:0;z-index:9999;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 12px;background:#222;box-shadow:0 3px 10px #0002}
.top-menu a{color:#fff;text-decoration:none;font-size:15px;font-weight:bold;padding:10px 15px;border-radius:6px;transition:.2s}
.top-menu a:hover,.top-menu a.active{background:var(--red)}
.hero{min-height:340px;padding:75px 20px;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(120deg,#241a15dd,#241a15aa),linear-gradient(45deg,#6d2a16,#d28a39)}
.hero h1{font-size:clamp(2.2rem,6vw,4.5rem);margin:0 0 12px;letter-spacing:.06em}
.hero p{font-size:1.1rem;max-width:720px;line-height:1.8;margin:0 auto}
.container{max-width:1100px;margin:auto;padding:42px 20px}
h2.section-title{text-align:center;font-size:2rem;margin:0 0 12px}
.lead{text-align:center;line-height:1.8;color:#6c625b;margin:0 auto 28px;max-width:760px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.card{border:1px solid #eee0d5;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 18px #0000000c}
.card .visual{height:165px;display:grid;place-items:center;background:linear-gradient(135deg,#f7dfbd,#b95b32);font-size:4rem}
.card-content{padding:20px}
.card h3{margin:0 0 8px}
.card p{line-height:1.7;color:#625951}
.price{font-size:1.25rem;font-weight:bold;color:var(--red)}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border:0;border-radius:7px;padding:12px 18px;font-weight:bold;cursor:pointer}
.btn:hover{background:#851717}
.btn.secondary{background:#333}
.info-panel{background:var(--cream);border-radius:14px;padding:24px;line-height:1.9}
footer{background:#222;color:#ddd;text-align:center;padding:24px 16px;margin-top:20px;font-size:.9rem}
footer a{color:#fff}
.notice{background:#fff4d9;border-left:4px solid var(--gold);padding:14px 16px;border-radius:6px;line-height:1.7}
form{display:grid;gap:14px;max-width:650px;margin:0 auto}
label{font-weight:bold;display:grid;gap:7px}
input,select,textarea{font:inherit;padding:12px;border:1px solid #d8cec4;border-radius:7px;width:100%}
@media(max-width:600px){.top-menu{gap:3px;padding:9px 4px}.top-menu a{font-size:13px;padding:8px}.container{padding:30px 15px}.hero{min-height:280px;padding:55px 18px}}
</style>
</head>
<body>
<nav class="top-menu" aria-label="メインナビゲーション">
<a href="index.html" >ホーム</a>
<a href="menu.html" >メニュー</a>
<a href="coupon.html" >クーポン</a>
<a href="store.html" >店舗情報</a>
<a href="recruit.html" class="active">採用情報</a>
</nav>

<header class="hero"><div><h1>RECRUIT</h1><p>一緒にお店を盛り上げる仲間を募集中！</p></div></header>
<main class="container"><h2 class="section-title">採用情報</h2><p class="lead">募集条件はサンプルです。実際の採用条件に合わせて更新してください。</p>
<div class="info-panel"><p><strong>募集職種：</strong>ホールスタッフ／キッチンスタッフ</p><p><strong>雇用形態：</strong>アルバイト・パート（サンプル）</p><p><strong>仕事内容：</strong>接客、配膳、調理補助、店内清掃など</p><p><strong>勤務時間：</strong>シフト制（詳細はお問い合わせください）</p><p><strong>応募方法：</strong>下記の連絡先・応募フォームを実際の運用に合わせて設定してください。</p></div>
<h2 class="section-title" style="margin-top:36px">応募フォーム（見本）</h2>
<form onsubmit="event.preventDefault(); alert('これは見本フォームです。送信機能を使うには、送信先の設定が必要です。');">
<label>お名前<input type="text" name="name" placeholder="例：山田 太郎" required></label>
<label>メールアドレス<input type="email" name="email" placeholder="example@example.com" required></label>
<label>希望職種<select name="job"><option>ホールスタッフ</option><option>キッチンスタッフ</option></select></label>
<label>メッセージ<textarea name="message" rows="4" placeholder="質問などがあれば入力してください"></textarea></label>
<button class="btn" type="submit">内容を確認する</button>
</form>
</main>

<footer>© GRILL HOUSE　｜　<a href="index.html">ホームへ戻る</a></footer>
</body>
</html>
